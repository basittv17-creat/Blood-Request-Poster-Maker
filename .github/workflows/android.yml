name: Android verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_test_apk:
        description: Build and upload one APK for phone testing
        type: boolean
        default: false
      build_signed_aab:
        description: Build and upload the signed Google Play App Bundle
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Format Dart files and publish any required formatting
        id: publish
        run: |
          dart format lib test integration_test
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test integration_test
            git commit -m "Apply Dart formatting for final release"
            git push origin HEAD:main
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.format.outputs.commit_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - name: Verify Flutter source and tests
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
      - name: Compile Android test build
        run: flutter build apk --debug --no-pub

  offline-device-tests:
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.format.outputs.commit_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/emulator-test.sh

  test-apk:
    if: inputs.build_test_apk || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-test-apk]'))
    needs: [format, verify, offline-device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.format.outputs.commit_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - run: flutter pub get --enforce-lockfile
      # Let Flutter regenerate the release registrant without dev-only plugins.
      - run: flutter build apk --release
      - name: Verify packaged launcher identity
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > apk-badging.txt
          grep -F "package: name='com.awasigogera.blood'" apk-badging.txt
          grep -Fx "application-label:'Blood Request'" apk-badging.txt
          grep -F "launchable-activity: name='com.awasigogera.blood.MainActivity'" apk-badging.txt
          for density in 160 240 320 480 640; do
            grep -E "^application-icon-${density}:" apk-badging.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: blood-request-poster-maker-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  signed-aab:
    if: github.ref == 'refs/heads/main' && (inputs.build_signed_aab || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-signed-aab]')))
    needs: [format, verify, offline-device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.format.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - run: flutter pub get --enforce-lockfile
      - name: Build and verify signed release bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/build-signed-aab.sh
      - uses: actions/upload-artifact@v4
        with:
          name: blood-request-play-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
