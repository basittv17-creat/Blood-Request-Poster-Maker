name: Android verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_test_apk:
        description: Build and upload one APK for phone testing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - name: Verify Flutter source and tests
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
      - name: Compile Android test build
        run: flutter build apk --debug --no-pub

  offline-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/emulator-test.sh

  test-apk:
    if: inputs.build_test_apk
    needs: [verify, offline-device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: blood-request-poster-maker-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
