name: blood_request
description: Offline Android blood request poster maker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.0.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Nastaliq
      fonts:
        - asset: assets/fonts/notonastaliqurdu.ttf
    - family: Naskh
      fonts:
        - asset: assets/fonts/notonaskharabic.ttf
    - family: Devanagari
      fonts:
        - asset: assets/fonts/notosansdevanagari.ttf
