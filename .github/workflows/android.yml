name: Build single Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-single-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp scripts/ci-gradle-mirror.init.gradle ~/.gradle/init.d/
      - name: Verify Flutter source and tests
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
      - name: Generate exactly one installable test APK
        run: |
          flutter build apk --debug
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/Blood-Request-Poster-Maker.apk
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test -s dist/Blood-Request-Poster-Maker.apk
      - name: Upload single APK only
        uses: actions/upload-artifact@v6
        with:
          name: Blood-Request-Poster-Maker-APK
          path: dist/Blood-Request-Poster-Maker.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
