name: Publish Blood Request website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx 'github-pages'; then
              echo "Pages artifact is visible to the GitHub API"
              exit 0
            fi
            echo "Waiting for Pages artifact to become visible ($attempt/12)"
            sleep 10
          done
          echo "Pages artifact was not indexed within 120 seconds" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
